services:
  postgres:
    image: postgres:16
    container_name: gridcast_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - gridcast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 10
    environment:
      TZ: America/Toronto
      PGTZ: America/Toronto
volumes:
  gridcast_pgdata: